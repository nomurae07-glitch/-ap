<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta property="og:title" content="北九州加盟店マップ" />
    <meta property="og:description" content="北九州市のお得なクーポンも配信中！加盟店を探せるマップアプリです。" />
    <meta property="og:type" content="website" />

    <title>北九州加盟店マップ</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- デザイン変数 (明るい赤・コーラル・元気・温かみ) --- */
        :root {
            --bg-color: #fffaf9;       /* 背景：ほんのり桜色ホワイト */
            --card-bg: #ffffff;        /* カード背景：白 */
            --text-main: #5d4037;      /* メイン文字：ダークブラウン */
            --text-sub: #9e8580;       /* サブ文字：赤みグレー */
            
            --primary: #ff6b6b;        /* メイン：ブライトコーラルレッド */
            --primary-light: #fff0f0;  /* メイン薄い色 */
            --primary-dark: #ee5253;   /* メイン濃い色 */
            
            --accent: #48cfad;         /* アクセント：ミントグリーン */
            --accent-bg: #e0f2f1;      /* アクセント背景 */
            
            --border: #ffE4e1;         /* 枠線：薄いピンク */
            --shadow: 0 4px 15px rgba(255, 107, 107, 0.15); /* 赤系のふんわり影 */
        }

        /* --- 基本スタイル --- */
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; 
            background: var(--bg-color); color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
        }
        #app { display: flex; flex-direction: column; height: 100%; position: relative; overflow: hidden; }

        /* --- ヘッダー --- */
        header {
            background: rgba(255, 255, 255, 0.95);
            height: 64px; 
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; 
            box-shadow: 0 2px 10px rgba(255, 107, 107, 0.1); 
            z-index: 1001;
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
        }
        .header-title { 
            font-weight: bold; font-size: 17px; color: var(--text-main); 
            letter-spacing: 0.05em; 
        }
        .menu-btn { 
            font-size: 24px; color: var(--primary); 
            cursor: pointer; border: none; background: none; padding: 8px; 
            transition: transform 0.2s;
        }
        .menu-btn:active { transform: scale(0.9); }

        /* --- フィルタ（ジャンル選択） --- */
        #category-filter {
            padding: 15px 20px; background: var(--bg-color); 
            white-space: nowrap; overflow-x: auto; 
            z-index: 999; display: flex; gap: 10px; scrollbar-width: none;
        }
        #category-filter::-webkit-scrollbar { display: none; }

        .filter-chip {
            padding: 8px 18px; border-radius: 20px; background: #fff; 
            font-size: 13px; font-weight: 600; color: var(--text-sub); cursor: pointer; 
            border: 2px solid var(--border); 
            box-shadow: 0 2px 4px rgba(255, 100, 100, 0.05); flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .filter-chip.active { 
            background: var(--primary); color: white; border-color: var(--primary); 
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
            transform: translateY(-2px);
        }

        /* --- コンテンツエリア --- */
        #content-area { flex: 1; position: relative; overflow: hidden; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #list-view { 
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; 
            background: var(--bg-color); z-index: 0; overflow-y: auto; 
            padding: 20px; box-sizing: border-box;
            display: none; padding-bottom: 80px;
        }

        /* --- カードデザイン --- */
        .card { 
            background: var(--card-bg); border-radius: 16px; 
            margin-bottom: 24px; 
            box-shadow: var(--shadow); 
            overflow: hidden; border: none;
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.98); }
        
        .card-img { 
            width: 100%; height: 200px; object-fit: cover; 
            background: #fff0f0; display: block; cursor: pointer; 
        }

        .card-body { padding: 24px; }
        
        .card-cat { 
            display: inline-block; font-size: 11px; font-weight: bold; 
            color: var(--primary-dark); background: var(--primary-light); 
            padding: 6px 14px; border-radius: 20px; margin-bottom: 12px; 
            letter-spacing: 0.05em;
        }
        .card h3 { 
            margin: 0 0 15px 0; font-size: 18px; 
            color: var(--text-main); line-height: 1.5; 
        }
        
        /* 店舗情報 */
        .info-row { 
            display: flex; align-items: flex-start; margin-bottom: 10px; 
            font-size: 14px; color: var(--text-main); 
        }
        .info-icon { 
            width: 24px; color: var(--primary); 
            text-align: center; margin-right: 12px; font-size: 16px; margin-top: 1px; 
        }
        .info-content { flex: 1; line-height: 1.7; }
        .info-link { 
            color: var(--accent); text-decoration: none; border-bottom: 2px solid var(--accent-bg); 
            padding-bottom: 1px; font-weight: bold; transition: border-color 0.2s;
        }
        .info-link:hover { border-color: var(--accent); }

        /* アクションボタン */
        .card-actions { 
            display: flex; gap: 12px; margin-top: 24px; 
            border-top: 2px dashed var(--border); 
            padding-top: 18px; 
            flex-wrap: wrap; /* ボタンが多い場合に折り返し */
        }
        .btn-action {
            flex: 1; min-width: 120px; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px; border-radius: 12px; text-decoration: none; 
            font-size: 13px; font-weight: bold; transition: all 0.2s;
        }
        .btn-route { 
            background: #fff; color: var(--text-main); border: 2px solid var(--border);
        }
        .btn-web { 
            background: var(--accent-bg); color: var(--accent); 
        }
        .btn-sns { 
            background: #fdf2f8; color: #db2777; /* SNS用ピンク */
        }
        .btn-action:active { transform: scale(0.95); }

        /* --- クーポンエリア --- */
        .coupon-area { 
            background: #fff; 
            border: 2px dashed var(--primary); 
            border-radius: 12px; 
            padding: 16px; margin-top: 24px; 
        }
        .coupon-title { 
            font-size: 12px; font-weight: bold; color: var(--primary); 
            margin-bottom: 12px; display: block; letter-spacing: 0.05em; 
        }
        .coupon-slider { 
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 5px; 
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch; 
            scroll-snap-type: x mandatory;
        }
        .coupon-item { 
            min-width: 260px; max-width: 260px; /* サイズ拡大 */
            background: white; border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.1);
            border: 1px solid var(--primary-light); overflow: hidden; flex-shrink: 0; 
            scroll-snap-align: start;
            display: flex; flex-direction: column;
        }
        .coupon-thumb { 
            width: 100%; height: 160px; /* サイズ拡大 */
            object-fit: cover; cursor: pointer; display: block;
        }
        .coupon-btn { 
            display: block; background: var(--primary); color: white; 
            text-align: center; padding: 12px; text-decoration: none; 
            font-weight: bold; font-size: 13px; letter-spacing: 0.05em;
            transition: background 0.2s;
        }
        .coupon-btn:active { background: var(--primary-dark); }
        .coupon-btn.disabled { background: #e0e0e0; color: #aaa; pointer-events: none; }

        /* --- ポップアップ (地図上) --- */
        .leaflet-popup-content-wrapper { 
            padding: 0; border-radius: 16px; overflow: hidden; 
            box-shadow: 0 5px 25px rgba(255, 107, 107, 0.2); 
        }
        .leaflet-popup-content { margin: 0; width: 260px !important; }
        .popup-img { width: 100%; height: 140px; object-fit: cover; background: #fff0f0; }
        .popup-body { padding: 16px; }
        .popup-title { 
            font-weight: bold; font-size: 15px; display: block; 
            margin-bottom: 6px; color: var(--text-main); 
        }
        .popup-meta { 
            font-size: 12px; color: var(--text-sub); 
            display: flex; align-items: center; gap: 6px; margin-bottom: 8px; 
        }

        /* --- ドロワーメニュー --- */
        #drawer-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(93, 64, 55, 0.2); backdrop-filter: blur(2px);
            z-index: 2000; display: none; opacity: 0; transition: opacity 0.3s; 
        }
        #drawer { 
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%; 
            background: #fff; z-index: 2001; transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex; flex-direction: column; 
            box-shadow: 4px 0 20px rgba(255, 107, 107, 0.1);
        }
        .drawer-header { 
            padding: 30px 20px; background: var(--primary-light); font-weight: bold; 
            border-bottom: 1px solid var(--border); font-size: 18px; color: var(--primary-dark);
        }
        .search-box { padding: 20px; background: #fff; border-bottom: 1px solid #fffaf9; }
        .search-input { 
            width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; 
            box-sizing: border-box; font-size: 14px; background: #fff; 
            color: var(--text-main); transition: border-color 0.3s;
        }
        .search-input:focus { border-color: var(--primary); outline: none; }
        
        .drawer-item { 
            padding: 18px 24px; border-bottom: 1px solid #f9f9f9; 
            cursor: pointer; display: flex; align-items: center; 
            font-size: 14px; color: var(--text-main); transition: background 0.2s;
        }
        .drawer-item i { width: 32px; color: var(--primary); font-size: 18px; }
        .drawer-item:active { background: var(--primary-light); }
        .drawer-footer { 
            margin-top: auto; padding: 20px; font-size: 11px; 
            text-align: center; color: #aaa; background: #fff;
        }

        /* --- 詳細モーダル --- */
        #detail-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.7); z-index: 2500; 
            display: none; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box;
            backdrop-filter: blur(5px); 
        }
        #detail-content { 
            width: 100%; max-width: 500px; max-height: 90vh; 
            overflow-y: auto; border-radius: 20px; position: relative; 
            box-shadow: 0 15px 50px rgba(255, 107, 107, 0.2);
            scrollbar-width: none; -ms-overflow-style: none;
        }
        #detail-content::-webkit-scrollbar { display: none; }
        
        #detail-close-btn {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(255,255,255,0.9); color: var(--primary); width: 40px; height: 40px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 24px; transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #detail-close-btn:active { transform: scale(0.9); }

        /* 画像拡大モーダル */
        #image-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(50, 40, 30, 0.95); z-index: 3000; display: none; align-items: center; justify-content: center; }
        #image-modal img { max-width: 95%; max-height: 95%; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        #modal-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 34px; cursor: pointer; padding: 20px; }

    </style>
</head>
<body>

    <div id="app">
        <header>
            <button class="menu-btn" onclick="openDrawer()"><i class="fa-solid fa-bars"></i></button>
            <div class="header-title">北九州加盟店マップ</div>
            <button class="menu-btn" onclick="toggleView()" id="header-toggle-icon">
                <i class="fa-solid fa-list"></i>
            </button>
        </header>

        <div id="category-filter">
            </div>

        <div id="content-area">
            <div id="map"></div>
            <div id="list-view"></div>
        </div>
    </div>

    <div id="detail-modal" onclick="closeDetailModal(event)">
        <div id="detail-content"></div>
    </div>

    <div id="drawer-overlay" onclick="closeDrawer()"></div>
    <div id="drawer">
        <div class="drawer-header">Menu</div>
        
        <div class="search-box">
            <div style="margin-bottom:8px; font-size:12px; font-weight:bold; color: var(--text-sub);">キーワード検索</div>
            <input type="text" class="search-input" id="keyword-search" placeholder="店名、住所、ジャンルなど..." oninput="filterData()">
        </div>

        <div class="drawer-item" onclick="getMyLocation(); closeDrawer();">
            <i class="fa-solid fa-location-crosshairs"></i> 現在地を表示
        </div>
        <div class="drawer-item" onclick="toggleView(); closeDrawer();">
            <i class="fa-solid fa-list" id="drawer-toggle-icon"></i> <span id="drawer-toggle-text">加盟店一覧を表示</span>
        </div>
        <div class="drawer-item" onclick="location.reload();" style="margin-top:10px; border-top:1px solid #eee;">
            <i class="fa-solid fa-rotate"></i> データを更新
        </div>

        <div class="drawer-footer">
            Map Data © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>, © <a href="https://carto.com/attributions">CARTO</a>
        </div>
    </div>

    <div id="image-modal" onclick="this.style.display='none'">
        <span id="modal-close">×</span>
        <img id="modal-img" src="">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ★★★ あなたのGAS URL 設定済み ★★★
        const API_URL = "https://script.google.com/macros/s/AKfycbx2_qMfBIFFeGYsgNq7e5JEMP-5vjiNQhYbYIz7ACnz4xy2UWZDrxZElbFMhXeMr4FMLQ/exec"; 

        let map;
        let allData = []; 
        let filteredData = []; 
        let markers = []; 
        let isMapView = true;
        let currentCategory = 'all';

        window.onload = function() {
            initMap();
            fetchData();
        };

        function initMap() {
            // --- 1. 地図スタイル (CartoDB Voyager) ---
            const voyagerLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            });

            // --- 2. 地図初期化 ---
            map = L.map('map', {
                zoomControl: false 
            }).setView([33.8833, 130.8750], 12); // 北九州市中心
            
            voyagerLayer.addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);
        }

        async function fetchData() {
            if (API_URL.includes("ここにあなたの")) {
                useMockData(); return;
            }
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error("Error");
                allData = await res.json();
                if(!allData || allData.length === 0) { useMockData(); return; }
                initData(allData);
            } catch (e) {
                useMockData();
            }
        }

        function initData(data) {
            allData = data;
            filteredData = data;
            generateCategoryFilter(allData);
            renderData(allData);
            
            if(markers.length > 0) {
                 const group = new L.featureGroup(markers);
                 map.fitBounds(group.getBounds());
            }
        }

        // --- フィルタリング機能 ---
        function filterData() {
            const keyword = document.getElementById('keyword-search').value.toLowerCase();
            
            filteredData = allData.filter(item => {
                const catMatch = currentCategory === 'all' || item.category === currentCategory;
                const targetText = (
                    (item.name || "") + 
                    (item.description || "") + 
                    (item.category || "") + 
                    (item.tel || "") +
                    (item.address || "")
                ).toLowerCase();
                const keyMatch = !keyword || targetText.includes(keyword);
                return catMatch && keyMatch;
            });
            renderData(filteredData);
        }

        // --- データ描画 ---
        function renderData(data) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            const listContainer = document.getElementById('list-view');
            listContainer.innerHTML = "";

            if(data.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; padding:40px; color:#aaa;">該当する店舗が見つかりません</div>';
                return;
            }

            data.forEach(shop => {
                const shopImg = shop.image ? shop.image : 'https://placehold.jp/300x200.png?text=No+Image';

                // --- A. 地図上のピン ---
                if(shop.lat && shop.lng) {
                    const marker = L.marker([shop.lat, shop.lng]).addTo(map);
                    marker.bindPopup(`
                        <div>
                            <img src="${shopImg}" class="popup-img">
                            <div class="popup-body">
                                <span class="popup-title">${shop.name}</span>
                                <div class="popup-meta"><i class="fa-solid fa-tag"></i> ${shop.category}</div>
                                ${shop.hours ? `<div class="popup-meta"><i class="fa-regular fa-clock"></i> ${shop.hours}</div>` : ''}
                                <button onclick="openDetailModal(${shop.id})" style="width:100%; margin-top:8px; padding:8px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">詳細を表示</button>
                            </div>
                        </div>
                    `);
                    markers.push(marker);
                }

                // --- B. 加盟店一覧 (リスト) ---
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `shop-${shop.id}`;
                card.innerHTML = createCardHTML(shop, shopImg);
                listContainer.appendChild(card);
            });
        }

        // ★カードのHTML生成
        function createCardHTML(shop, imgUrl) {
            // 情報パーツ (住所・電話・時間・URL・SNS)
            const addressHtml = shop.address ? 
                `<div class="info-row"><div class="info-icon"><i class="fa-solid fa-location-dot"></i></div><div class="info-content">${shop.address}</div></div>` : '';
            const telHtml = shop.tel ? 
                `<div class="info-row"><div class="info-icon"><i class="fa-solid fa-phone"></i></div><div class="info-content"><a href="tel:${shop.tel}" class="info-link">${shop.tel}</a></div></div>` : '';
            const hoursHtml = shop.hours ? 
                `<div class="info-row"><div class="info-icon"><i class="fa-regular fa-clock"></i></div><div class="info-content">${shop.hours}</div></div>` : '';
            const urlHtml = shop.url ? 
                `<div class="info-row"><div class="info-icon"><i class="fa-solid fa-globe"></i></div><div class="info-content"><a href="${shop.url}" target="_blank" class="info-link">公式サイト</a></div></div>` : '';

            // --- クーポンパーツ ---
            let couponHtml = '';
            
            if (shop.coupon_imgs) {
                const imgList = shop.coupon_imgs.split(',');
                const urlList = shop.coupon_urls ? shop.coupon_urls.split(',') : [];
                
                let slidesHtml = '';
                imgList.forEach((img, index) => {
                    const cleanImg = img.trim();
                    if(!cleanImg) return;
                    let targetUrl = urlList[index] ? urlList[index].trim() : (shop.coupon_url || "");
                    
                    let btnElement = targetUrl 
                        ? `<a href="${targetUrl}" target="_blank" class="coupon-btn">クーポンを使う</a>`
                        : `<span class="coupon-btn disabled">クーポンなし</span>`;

                    slidesHtml += `
                        <div class="coupon-item">
                            <img src="${cleanImg}" class="coupon-thumb" onclick="openImageModal('${cleanImg}')">
                            ${btnElement}
                        </div>
                    `;
                });

                if(slidesHtml) {
                    const hintText = imgList.length > 1 ? " (横にスライド)" : "";
                    couponHtml = `
                        <div class="coupon-area">
                            <span class="coupon-title"><i class="fa-solid fa-gift"></i> お得なクーポン${hintText}</span>
                            <div class="coupon-slider">${slidesHtml}</div>
                        </div>
                    `;
                }
            } else if (shop.coupon_url) {
                couponHtml = `
                    <div class="coupon-area">
                        <span class="coupon-title"><i class="fa-solid fa-gift"></i> お得なクーポン</span>
                        <a href="${shop.coupon_url}" target="_blank" class="coupon-btn">クーポンを使う</a>
                    </div>
                `;
            }

            // ルート案内リンクの生成
            let routeUrl = "";
            if (shop.lat && shop.lng) {
                routeUrl = `https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lng}`;
            }

            return `
                <img src="${imgUrl}" class="card-img" onclick="openImageModal('${imgUrl}')">
                <div class="card-body">
                    <span class="card-cat">${shop.category}</span>
                    <h3>${shop.name}</h3>
                    <div style="margin-bottom:20px;">
                        ${addressHtml}
                        ${telHtml}
                        ${hoursHtml}
                        ${urlHtml}
                    </div>
                    <div style="font-size:14px; color:var(--text-sub); line-height:1.7;">${shop.description || '詳細情報なし'}</div>
                    ${couponHtml}
                    <div class="card-actions">
                        <a href="${routeUrl}" target="_blank" class="btn-action btn-route">
                            <i class="fa-solid fa-location-arrow"></i> ルート案内
                        </a>
                        ${shop.url ? `<a href="${shop.url}" target="_blank" class="btn-action btn-web"><i class="fa-solid fa-arrow-up-right-from-square"></i> WEB</a>` : ''}
                        ${shop.sns ? `<a href="${shop.sns}" target="_blank" class="btn-action btn-sns"><i class="fa-brands fa-instagram"></i> SNS</a>` : ''}
                    </div>
                </div>
            `;
        }

        // --- 詳細モーダル表示機能 ---
        window.openDetailModal = function(id) {
            const shop = allData.find(s => s.id == id);
            if (!shop) return;
            const shopImg = shop.image ? shop.image : 'https://placehold.jp/300x200.png?text=No+Image';
            const html = createCardHTML(shop, shopImg);
            const content = document.getElementById('detail-content');
            content.innerHTML = `
                <div id="detail-close-btn" onclick="document.getElementById('detail-modal').style.display='none'">×</div>
                <div class="card" style="margin-bottom:0; box-shadow:none; border:none; border-radius:16px;">
                    ${html}
                </div>
            `;
            document.getElementById('detail-modal').style.display = 'flex';
        }

        window.closeDetailModal = function(e) {
            if(e.target.id === 'detail-modal') {
                document.getElementById('detail-modal').style.display = 'none';
            }
        }

        // --- その他の機能 ---
        function generateCategoryFilter(data) {
            const categories = [...new Set(data.map(item => item.category).filter(c => c))];
            const otherIndex = categories.indexOf("その他");
            if (otherIndex > -1) {
                categories.splice(otherIndex, 1); 
                categories.push("その他"); 
            }

            const filterContainer = document.getElementById('category-filter');
            filterContainer.innerHTML = '<div class="filter-chip active" onclick="filterCategory(\'all\', this)">すべて</div>';
            categories.forEach(cat => {
                const chip = document.createElement('div');
                chip.className = 'filter-chip';
                chip.innerText = cat;
                chip.onclick = function() { filterCategory(cat, this); };
                filterContainer.appendChild(chip);
            });
        }

        function filterCategory(cat, element) {
            currentCategory = cat;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            filterData(); 
        }

        function toggleView(forceList = null) {
            const mapEl = document.getElementById('map');
            const listEl = document.getElementById('list-view');
            const icon = document.querySelector('#header-toggle-icon i');
            const dIcon = document.getElementById('drawer-toggle-icon');
            const dText = document.getElementById('drawer-toggle-text');

            const nextState = forceList !== null ? !forceList : !isMapView;

            if (!nextState) { // リスト表示
                mapEl.style.zIndex = 0;
                listEl.style.display = 'block';
                listEl.style.zIndex = 1;
                icon.className = "fa-solid fa-map";
                if(dIcon) dIcon.className = "fa-solid fa-map";
                if(dText) dText.innerText = "地図を表示";
                isMapView = false;
            } else { // 地図表示
                mapEl.style.zIndex = 1;
                listEl.style.display = 'none';
                listEl.style.zIndex = 0;
                icon.className = "fa-solid fa-list";
                if(dIcon) dIcon.className = "fa-solid fa-list";
                if(dText) dText.innerText = "加盟店一覧を表示";
                isMapView = true;
                setTimeout(() => map.invalidateSize(), 100);
            }
        }

        function openDrawer() {
            document.getElementById('drawer-overlay').style.display = 'block';
            setTimeout(() => document.getElementById('drawer-overlay').style.opacity = 1, 10);
            document.getElementById('drawer').style.left = '0';
        }
        function closeDrawer() {
            document.getElementById('drawer-overlay').style.opacity = 0;
            document.getElementById('drawer').style.left = '-280px';
            setTimeout(() => document.getElementById('drawer-overlay').style.display = 'none', 300);
        }

        function getMyLocation() {
            if (!navigator.geolocation) { alert("位置情報が利用できません"); return; }
            if(!isMapView) toggleView();
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude; const lng = pos.coords.longitude;
                map.setView([lat, lng], 15);
                L.marker([lat, lng], {
                    icon: L.divIcon({ className: 'my-loc', html: '<div style="background:var(--primary); width:16px; height:16px; border:3px solid white; border-radius:50%; box-shadow:0 0 5px rgba(0,0,0,0.4);"></div>' })
                }).addTo(map).bindPopup("現在地").openPopup();
            });
        }

        function openImageModal(src) {
            document.getElementById('modal-img').src = src;
            document.getElementById('image-modal').style.display = 'flex';
        }

        // --- ダミーデータ ---
        function useMockData() {
            const mock = [
                { 
                    id:1, name:"サンプル店", lat:33.8844, lng:130.8744, category:"サンプル", 
                    description:"データ読み込みエラー", tel:"", hours:"", url:"", 
                    image:"", coupon_imgs:"", coupon_urls:"" 
                }
            ];
            initData(mock);
        }
    </script>
</body>
